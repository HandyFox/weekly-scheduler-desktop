[package]
name = "weekly-scheduler"
version = "1.1.0"
edition = "2021"
description = "Weekly Assignment Scheduler: plan each week and print a sheet per student"
build = "build.rs"

[[bin]]
name = "WeeklyScheduler"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
minijinja = "2"
minijinja-contrib = { version = "2", features = ["pycompat"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
fastrand = "2"
dirs = "6"
opener = "0.8"
form_urlencoded = "1"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
windows-sys = { version = "0.60", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.21"
tao = "0.34"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
